<style>
:root{color-scheme:light;--g:#0b5bd3;--g2:#e8f0fd;--inc:#0b7a5c;--exp:#c8422b;--blue:#0b5bd3;--amb:#d99a0b;--bg:#f2f6fc;--card:#fff;--tx:#14213a;--mut:#62728c;--bd:#e0e8f3;--insbg:var(--insbg);--bar:#e3ebf6;--hov:#0847a8;--sh:0 2px 10px rgba(20,50,100,.08)}
[data-theme=dark]{color-scheme:dark;--g:#3b78f0;--g2:#1c2d4a;--inc:#3ecf9a;--exp:#ff8264;--blue:#7aa8ff;--amb:#f0b429;--bg:#0d1420;--card:#162033;--tx:#e8eef7;--mut:#8fa1b8;--bd:#263650;--insbg:#2b2a1a;--bar:#263650;--hov:#2f66d6;--sh:0 2px 10px rgba(0,0,0,.4)}
[data-theme=dark] .seg button.on{color:#0d1420}.btn:disabled{opacity:.35;cursor:default}.brand img{border-radius:10px}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#side{display:none}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px}h2{font-size:16px;margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.bal{background:linear-gradient(135deg,#0b5bd3,#08419a);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}
.bal .big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.mini b{display:block;font-size:14px;margin-top:2px;word-break:break-word}
.inc{color:var(--inc)}.exp{color:var(--exp)}.blue{color:var(--blue)}
.btn{border:0;background:var(--g);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;transition:transform .1s,background .2s}
.btn:hover{background:var(--hov)}.btn:active{transform:scale(.97)}
.btn.o{background:var(--card);color:var(--g);border:1.5px solid var(--g)}
.btn.r{background:var(--exp)}.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.l{background:var(--g2);color:var(--g)}
:focus-visible{outline:3px solid #2563a8;outline-offset:2px}
input,select,textarea{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;background:var(--card)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--g2);flex:none}
.tx{padding:11px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.tx .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.bar{height:9px;border-radius:9px;background:var(--bar);overflow:hidden}

.bar i.w{background:var(--amb)}.bar i.d{background:var(--exp)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.ins{background:#fff8e6;border-left:4px solid var(--amb);padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.ins.ok{background:var(--g2);border-color:var(--g)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;border-radius:30px;padding:14px 20px;box-shadow:0 6px 18px rgba(11,91,211,.4)}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.07);z-index:15}
#nav a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);padding:4px 10px;border-radius:10px}
#nav a span{font-size:20px}#nav a.on{color:var(--g);font-weight:700}
#ov{position:fixed;inset:0;background:rgba(10,30,22,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
#ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.x{border:0;background:var(--g2);border-radius:50%;width:32px;height:32px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg button{border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:10px;font-weight:600;cursor:pointer}
.seg button.on.i{background:var(--inc);color:#fff;border-color:var(--inc)}
.seg button.on.e{background:var(--exp);color:#fff;border-color:var(--exp)}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#14261f;color:#fff;padding:11px 18px;border-radius:14px;z-index:99;transition:transform .3s;max-width:90%}
#toast.on{transform:translate(-50%,0)}
.empty{text-align:center;padding:30px 16px}.empty .big{font-size:56px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}td:last-child,th:last-child{text-align:right}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.lg i{width:11px;height:11px;border-radius:3px;flex:none}
.err{color:var(--exp);font-size:12px;margin-top:4px}
.menu a{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--bd)}
.brand{font-weight:800;color:var(--g);font-size:20px}
@media(min-width:900px){
 body{padding-left:240px;padding-bottom:20px}
 #side{display:block;position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--card);padding:20px 14px;box-shadow:var(--sh)}
 #side a{display:flex;gap:10px;padding:11px 12px;border-radius:12px;margin-bottom:4px}
 #side a.on{background:var(--g2);color:var(--g);font-weight:700}
 #nav{display:none}.fab{bottom:24px;right:28px}
 #ov{align-items:center}.sheet{border-radius:22px}
 .wrap{max-width:900px}
}
body.noauth .fab,body.noauth #nav,body.noauth #side{display:none!important}body.noauth{padding-left:0!important;padding-bottom:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,onSnapshot,writeBatch,arrayUnion}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD9H90hMDqsCJtyv2tOvaoKM5j2Mx7Y8_s",authDomain:"uangkita-82436.firebaseapp.com",projectId:"uangkita-82436",storageBucket:"uangkita-82436.firebasestorage.app",messagingSenderId:"374995466966",appId:"1:374995466966:web:7178d154623066f728a777"};
const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp);
const fdb=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
let FID=null,USER=null,NAME='',ready=false,unsubs=[];
const $=s=>document.querySelector(s);
const STORES=['transactions','categories','budgets','savings_goals','recurring_transactions','settings'];
const S={tx:[],cats:[],bud:[],goals:[],rec:[],period:'month',cs:'',ce:'',moff:0};
const F={q:'',type:'',cat:'',pm:'',from:'',to:'',sort:'new'};
const KEY={tx:'transactions',cats:'categories',bud:'budgets',goals:'savings_goals',rec:'recurring_transactions'};
const NAME2K=Object.fromEntries(Object.entries(KEY).map(([k,v])=>[v,k]));
const fail=e=>{console.error(e);toast('Gagal menyimpan. Periksa koneksi atau izin akses.')};
const ref=(k,id)=>doc(fdb,'families',FID,KEY[k],id);
const dbAll=async st=>S[NAME2K[st]]||[];
const dbPut=(k,o)=>{const i=S[k].findIndex(x=>x.id===o.id);i<0?S[k].push(o):S[k][i]=o;setDoc(ref(k,o.id),o).catch(fail);return Promise.resolve()};
const dbDel=(k,id)=>{S[k]=S[k].filter(x=>x.id!==id);deleteDoc(ref(k,id)).catch(fail);return Promise.resolve()};
const chunked=ops=>{for(let i=0;i<ops.length;i+=400){const b=writeBatch(fdb);ops.slice(i,i+400).forEach(f=>f(b));b.commit().catch(fail)}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const fd=s=>parse(s).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const today=()=>iso(new Date());
const EMO={Gaji:'💼',Bonus:'🎁',Bisnis:'🏪',Investasi:'📈',Hadiah:'🎀',Makanan:'🍽️',Belanja:'🛒',Transportasi:'🚗',Tagihan:'🧾',Listrik:'💡',Air:'💧',Internet:'📶',Pendidikan:'🎓',Kesehatan:'🩺','Rumah Tangga':'🏠',Hiburan:'🎬',Cicilan:'💳',Sedekah:'🤲',Lainnya:'🏷️'};
const emo=c=>EMO[c]||'🏷️';
const COL=['#0b5bd3','#2cb98a','#d99a0b','#8a4fbf','#c8422b','#17a2a2','#7a8b99','#d9622b'];
const PAY=['Cash','Bank','E-wallet'];
const DEFINC=['Gaji','Bonus','Bisnis','Investasi','Hadiah','Lainnya'];
const DEFEXP=['Makanan','Belanja','Transportasi','Tagihan','Listrik','Air','Internet','Pendidikan','Kesehatan','Rumah Tangga','Hiburan','Cicilan','Sedekah','Lainnya'];

function wipe(){const ops=[];for(const k in KEY){S[k].forEach(x=>ops.push(b=>b.delete(ref(k,x.id))));S[k]=[]}chunked(ops)}
function seedCats(){const l=[...DEFINC.map(n=>({id:uid(),name:n,type:'income'})),...DEFEXP.map(n=>({id:uid(),name:n,type:'expense'}))];S.cats=l;chunked(l.map(c=>b=>b.set(ref('cats',c.id),c)))}
const typing=()=>{const a=document.activeElement;return a&&$('#app').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)};
function startSync(){unsubs.forEach(u=>u());unsubs=[];ready=false;const seen=new Set(),tot=Object.keys(KEY).length;
 return new Promise((res,rej)=>{for(const k in KEY)unsubs.push(onSnapshot(collection(fdb,'families',FID,KEY[k]),sn=>{S[k]=sn.docs.map(d=>d.data());
  if(!seen.has(k)){seen.add(k);if(seen.size===tot)res()}else if(ready&&!typing())render(true)},rej))})}
async function enter(){await startSync();if(!S.cats.length)seedCats();ready=true;document.body.classList.remove('noauth');render();if(!NAME)askName()}
const catsOf=t=>S.cats.filter(c=>c.type===t).map(c=>c.name);

/* periods */
const PN={today:'Hari Ini',week:'Minggu Ini',month:'Bulan Ini',year:'Tahun Ini',custom:'Rentang Tanggal'};
function range(p=S.period){const t=new Date(),bd=new Date(t.getFullYear(),t.getMonth()+(arguments.length?0:S.moff),1),y=bd.getFullYear(),m=bd.getMonth();
 if(p==='today')return[iso(t),iso(t)];
 if(p==='week'){const s=new Date(t);s.setDate(t.getDate()-(t.getDay()+6)%7);const e=new Date(s);e.setDate(s.getDate()+6);return[iso(s),iso(e)]}
 if(p==='year')return[y+'-01-01',y+'-12-31'];
 if(p==='custom'&&S.cs&&S.ce)return[S.cs,S.ce];
 return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))]}
function prevR(r,p=S.period){const a=parse(r[0]),b=parse(r[1]);
 if(p==='month')return[iso(new Date(a.getFullYear(),a.getMonth()-1,1)),iso(new Date(a.getFullYear(),a.getMonth(),0))];
 if(p==='year')return[(a.getFullYear()-1)+'-01-01',(a.getFullYear()-1)+'-12-31'];
 const len=Math.round((b-a)/864e5)+1,e=new Date(a);e.setDate(e.getDate()-1);const s=new Date(e);s.setDate(e.getDate()-len+1);return[iso(s),iso(e)]}
const inR=(t,r)=>t.date>=r[0]&&t.date<=r[1];
function calc(r){let inc=0,exp=0,n=0;S.tx.forEach(t=>{if(inR(t,r)){n++;t.type==='income'?inc+=t.amount:exp+=t.amount}});return{inc,exp,n,net:inc-exp}}
const balance=()=>S.tx.reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0);
const chg=(c,p)=>p?Math.round((c-p)/p*100):null;
const chgTxt=(c,p,good)=>{const v=chg(c,p);if(v===null)return'<span class="mut">Belum ada pembanding</span>';return`<span class="${(v>=0)===good?'inc':'exp'}">${v>=0?'▲':'▼'} ${Math.abs(v)}% dari periode lalu</span>`};
function byCat(r,type='expense'){const m={};S.tx.forEach(t=>{if(t.type===type&&inR(t,r))m[t.category]=(m[t.category]||0)+t.amount});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function buckets(r){const a=parse(r[0]),b=parse(r[1]),days=Math.round((b-a)/864e5)+1,mo=days>62,out=[],map={};
 if(mo){for(let d=new Date(a.getFullYear(),a.getMonth(),1);d<=b;d.setMonth(d.getMonth()+1)){const k=iso(d).slice(0,7);const o={k,l:d.toLocaleDateString('id-ID',{month:'short'}),inc:0,exp:0};out.push(o);map[k]=o}}
 else for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const k=iso(d);const o={k,l:String(d.getDate()),inc:0,exp:0};out.push(o);map[k]=o}
 S.tx.forEach(t=>{const o=map[mo?t.date.slice(0,7):t.date];if(o&&inR(t,r))t.type==='income'?o.inc+=t.amount:o.exp+=t.amount});return out}

/* charts */
function barChart(r){const b=buckets(r),mx=Math.max(1,...b.map(x=>Math.max(x.inc,x.exp))),W=600,H=170,w=W/b.length,bw=Math.max(2,Math.min(14,w/2.6)),step=Math.ceil(b.length/10);
 let s=`<svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Grafik pemasukan dan pengeluaran">`;
 b.forEach((x,i)=>{const cx=i*w+w/2,hi=x.inc/mx*H,he=x.exp/mx*H;
  s+=`<rect x="${cx-bw-1}" y="${H-hi}" width="${bw}" height="${hi}" rx="2" fill="var(--inc)"><title>${x.l}: Pemasukan ${rp(x.inc)}</title></rect><rect x="${cx+1}" y="${H-he}" width="${bw}" height="${he}" rx="2" fill="var(--exp)" opacity=".85"><title>${x.l}: Pengeluaran ${rp(x.exp)}</title></rect>`;
  if(i%step===0)s+=`<text x="${cx}" y="${H+16}" font-size="11" fill="#667a72" text-anchor="middle">${x.l}</text>`});
 return s+`</svg><div class="row mut" style="gap:14px"><span class="inc">▲ Pemasukan</span><span class="exp">▼ Pengeluaran</span><span style="margin-left:auto">Maks ${rp(mx)}</span></div>`}
function lineChart(r){const b=buckets(r);let run=S.tx.filter(t=>t.date<r[0]).reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0);
 const pts=b.map(x=>run+=x.inc-x.exp),mn=Math.min(0,...pts),mx=Math.max(1,...pts),W=600,H=150,rg=mx-mn||1;
 const P=pts.map((v,i)=>[b.length>1?i/(b.length-1)*W:W/2,H-(v-mn)/rg*H]);
 const d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 return`<svg viewBox="0 0 ${W} ${H+8}" width="100%" role="img" aria-label="Tren saldo"><path d="${d} L${W} ${H} L0 ${H}Z" fill="rgba(11,91,211,.14)"/><path d="${d}" fill="none" stroke="var(--g)" stroke-width="3" stroke-linejoin="round"/></svg><div class="row sp mut"><span>${fd(r[0])}</span><span>Saldo akhir: <b>${rp(pts[pts.length-1]||0)}</b></span></div>`}
function donut(list){const tot=list.reduce((a,x)=>a+x[1],0);if(!tot)return'<p class="mut">Belum ada pengeluaran pada periode ini.</p>';
 let off=0,s='<svg viewBox="0 0 100 100" width="150" style="flex:none;transform:rotate(-90deg)" role="img" aria-label="Pengeluaran per kategori">';
 const top=list.slice(0,7);const rest=list.slice(7).reduce((a,x)=>a+x[1],0);if(rest)top.push(['Lainnya (gabungan)',rest]);
 top.forEach((x,i)=>{const f=x[1]/tot*251.3;s+=`<circle cx="50" cy="50" r="40" fill="none" stroke="${COL[i%8]}" stroke-width="16" stroke-dasharray="${f} ${251.3-f}" stroke-dashoffset="${-off}"/>`;off+=f});
 return`<div class="row" style="flex-wrap:wrap">${s}</svg><div class="grow">${top.map((x,i)=>`<div class="lg"><i style="background:${COL[i%8]}"></i><span class="grow">${esc(x[0])}</span><b>${Math.round(x[1]/tot*100)}%</b></div>`).join('')}</div></div>`}

/* UI helpers */
let tt;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)};
const sheet=(t,b)=>{$('#ov').innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sh"><b>${t}</b><button class="x" data-act="close" aria-label="Tutup">✕</button></div>${b}</div>`;$('#ov').classList.add('on')};
const close=()=>$('#ov').classList.remove('on');
let cb;const confirmD=(msg,fn,lbl='Hapus')=>{cb=fn;sheet('Konfirmasi',`<p style="margin:14px 0">${msg}</p><div class="grid2"><button class="btn o" data-act="close">Batal</button><button class="btn r" data-act="yes">${lbl}</button></div>`)};
const pct=(a,b)=>b?Math.min(999,Math.round(a/b*100)):0;
const barCls=p=>p>=100?'d':p>=80?'w':'';
function monthNav(){if(S.period!=='month'&&S.period!=='year')return'';const d=parse(range()[0]);const l=S.period==='year'?String(d.getFullYear()):d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});return`<div class="card row sp" style="padding:8px 10px;margin-bottom:10px"><button class="btn l s" data-act="mprev" aria-label="Sebelumnya">‹</button><b>${l}</b><button class="btn l s" data-act="mnext" ${S.moff>=0?'disabled':''} aria-label="Berikutnya">›</button></div>`}
function perLabel(){if((S.period==='month'||S.period==='year')&&S.moff!==0){const d=parse(range()[0]);return S.period==='year'?String(d.getFullYear()):d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}return PN[S.period]}
const perSel=()=>monthNav()+`<div class="row" style="margin-bottom:12px;flex-wrap:wrap"><select data-ch="per" style="width:auto" aria-label="Periode">${Object.entries(PN).map(([k,v])=>`<option value="${k}" ${S.period===k?'selected':''}>${v}</option>`).join('')}</select>${S.period==='custom'?`<input type="date" data-ch="cs" value="${S.cs}" style="width:auto" aria-label="Dari"><input type="date" data-ch="ce" value="${S.ce}" style="width:auto" aria-label="Sampai">`:''}</div>`;
const amtFmt=v=>{const d=v.replace(/\D/g,'');return d?(+d).toLocaleString('id-ID'):''};
const num=v=>+String(v).replace(/\D/g,'')||0;

function txRow(t,acts){return`<div class="tx row"><div class="ico">${emo(t.category)}</div><div class="grow"><div class="n">${esc(t.note||t.category)}</div><div class="mut">${fd(t.date)} · ${esc(t.category)} · ${esc(t.paymentMethod)}${t.byName?' · '+esc(t.byName):''}</div></div><div style="text-align:right"><div class="amt ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'▲ +':'▼ -'}${rp(t.amount).replace('Rp ','Rp ')}</div>${acts?`<button class="btn l s" data-act="edittx" data-id="${t.id}" aria-label="Edit">✏️</button> <button class="btn l s" data-act="deltx" data-id="${t.id}" aria-label="Hapus">🗑️</button>`:''}</div></div>`}
const empty=(ic,t,d,btn='')=>`<div class="empty"><div class="big">${ic}</div><h2>${t}</h2><p class="mut" style="margin-bottom:14px">${d}</p>${btn}</div>`;

/* insights */
function insights(){const out=[],r=range('month'),p=prevR(r,'month'),c=calc(r),pc=calc(p),cats=byCat(r);
 if(cats[0])out.push(`Pengeluaran terbesar bulan ini adalah ${cats[0][0]} (${rp(cats[0][1])}).`);
 const v=chg(c.exp,pc.exp);if(v!==null&&v!==0)out.push(`Pengeluaran bulan ini ${v>0?'naik':'turun'} ${Math.abs(v)}% dibanding bulan lalu.`);
 if(pc.inc&&c.inc>pc.inc)out.push('Pemasukan bulan ini lebih besar daripada bulan lalu.');
 S.bud.forEach(b=>{const sp=(cats.find(x=>x[0]===b.category)||[0,0])[1],q=pct(sp,b.limit);if(q>=100)out.push(`⚠️ Budget ${b.category} sudah terlampaui (${q}%).`);else if(q>=80)out.push(`Budget ${b.category} sudah digunakan ${q}%.`)});
 const pend=S.rec.filter(x=>x.last!==today().slice(0,7)).length;if(pend)out.push(`${pend} transaksi rutin belum dicatat bulan ini.`);
 return out}

 <div class="grid2"><div class="mini"><span class="mut">Pemasukan hari ini</span><b class="inc">${rp(t.inc)}</b></div><div class="mini"><span class="mut">Pengeluaran hari ini</span><b class="exp">${rp(t.exp)}</b></div></div>

 <div class="card"><h2>Ringkasan Keuangan</h2><p class="mut" style="margin-bottom:8px">${perLabel()} · ${chgTxt(c.net,pc.net,true)}</p>${barChart(r)}</div>

 <label for="d">Tanggal</label><input id="d" type="date" name="date" value="${t.date||today()}">
 <label for="p">Metode Pembayaran</label><select id="p" name="pm">${PAY.map(c=>`<option ${pmd===c?'selected':''}>${c}</option>`).join('')}</select>
 <label for="n">Catatan (opsional)</label><input id="n" name="note" maxlength="100" placeholder="Contoh: Belanja bulanan" value="${esc(t.note)}">
 <label for="ac">Sumber Akun (opsional)</label><input id="ac" name="account" maxlength="40" placeholder="Contoh: BCA, GoPay" value="${esc(t.account)}">
 <button class="btn" style="width:100%;margin-top:16px">Simpan</button></form>`);setTimeout(()=>$('#a')?.focus(),50)}
function simple(title,fields,f,v={}){sheet(title,`<form data-f="${f}" novalidate><input type="hidden" name="id" value="${v.id||''}">${fields}<button class="btn" style="width:100%;margin-top:16px">Simpan</button></form>`)}
const catOpts=(t,sel)=>catsOf(t).map(c=>`<option ${sel===c?'selected':''}>${esc(c)}</option>`).join('');
const fAmt=(n,l,v)=>`<label>${l}</label><input name="${n}" inputmode="numeric" data-amt value="${v?(+v).toLocaleString('id-ID'):''}" placeholder="0" autocomplete="off">`;

const forms={
 async tx(f){const d=new FormData(f),amount=num(d.get('amount')),date=d.get('date');
  if(!amount){$('#ea').textContent='Masukkan nominal lebih dari 0.';return}if(amount>1e13){$('#ea').textContent='Nominal terlalu besar.';return}if(!date){toast('Pilih tanggal dulu');return}
  const old=S.tx.find(t=>t.id===d.get('id')),now=Date.now();
  const o={id:old?old.id:uid(),type:d.get('type'),amount,category:d.get('category'),date,note:d.get('note').trim(),paymentMethod:d.get('pm'),account:d.get('account').trim(),by:old?(old.by||''):USER.uid,byName:old?(old.byName||''):myName(),createdAt:old?old.createdAt:now,updatedAt:now};try{localStorage.setItem('uk-pm',d.get('pm'))}catch{}
  await dbPut('tx',o);S.tx=await dbAll('transactions');close();render();toast(old?'Transaksi diperbarui':'Transaksi ditambahkan')},
 async bud(f){const d=new FormData(f),limit=num(d.get('limit'));if(!limit)return toast('Isi nominal budget');
  const ex=S.bud.find(b=>b.id===d.get('id'))||S.bud.find(b=>b.category===d.get('category'));await dbPut('bud',{id:ex?.id||uid(),category:d.get('category'),limit});S.bud=await dbAll('budgets');close();render();toast('Budget disimpan')},
 async goal(f){const d=new FormData(f),target=num(d.get('target')),name=d.get('name').trim();if(!name||!target)return toast('Isi nama dan target nominal');
  const ex=S.goals.find(g=>g.id===d.get('id'));await dbPut('goals',{id:ex?.id||uid(),name,target,saved:num(d.get('saved')),deadline:d.get('deadline')});S.goals=await dbAll('savings_goals');close();render();toast('Target disimpan')},
 async fund(f){const d=new FormData(f),g=S.goals.find(x=>x.id===d.get('id')),a=num(d.get('a'));if(!a)return toast('Isi nominal');g.saved+=a;await dbPut('goals',g);close();render();toast('Dana ditambahkan')},
 async rec(f){const d=new FormData(f),amount=num(d.get('amount')),note=d.get('note').trim();if(!amount||!note)return toast('Isi nama dan nominal');
  const ex=S.rec.find(r=>r.id===d.get('id'));await dbPut('rec',{id:ex?.id||uid(),type:d.get('type'),amount,category:d.get('category'),paymentMethod:d.get('pm'),note,day:Math.min(31,Math.max(1,+d.get('day')||1)),last:ex?.last||''});S.rec=await dbAll('recurring_transactions');close();render();toast('Template disimpan')},
 async cat(f){const d=new FormData(f),n=d.get('n').trim(),t=d.get('t');if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase()&&c.type===t))return toast('Kategori sudah ada');
  await dbPut('cats',{id:uid(),name:n,type:t});S.cats=await dbAll('categories');render();toast('Kategori ditambahkan')}
};
function recForm(x={}){const t=x.type||'expense';simple(x.id?'Ubah Template':'Template Rutin',`<label>Jenis</label><select name="type" data-ch="rtype"><option value="expense" ${t==='expense'?'selected':''}>Pengeluaran</option><option value="income" ${t==='income'?'selected':''}>Pemasukan</option></select><label>Nama</label><input name="note" value="${esc(x.note)}" placeholder="Contoh: Listrik PLN" maxlength="60">${fAmt('amount','Nominal (Rp)',x.amount)}<label>Kategori</label><select name="category" id="rcat">${catOpts(t,x.category)}</select><label>Tanggal tiap bulan</label><input type="number" name="day" min="1" max="31" value="${x.day||1}"><label>Metode</label><select name="pm">${PAY.map(c=>`<option ${x.paymentMethod===c?'selected':''}>${c}</option>`).join('')}</select>`,'rec',x)}
function budForm(b={}){simple(b.id?'Ubah Budget':'Tambah Budget',`<label>Kategori</label><select name="category">${catOpts('expense',b.category)}</select>${fAmt('limit','Batas per bulan (Rp)',b.limit)}`,'bud',b)}
function goalForm(g={}){simple(g.id?'Ubah Target':'Target Baru',`<label>Nama target</label><input name="name" value="${esc(g.name)}" maxlength="60" placeholder="Liburan keluarga">${fAmt('target','Target nominal (Rp)',g.target)}${fAmt('saved','Nominal terkumpul (Rp)',g.saved)}<label>Deadline</label><input type="date" name="deadline" value="${g.deadline||''}">`,'goal',g)}

/* actions */
const dl=(name,txt,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const find=(k,id)=>S[k].find(x=>x.id===id);
const del=(k,id,label,msg)=>confirmD(msg,async()=>{await dbDel(k,id);S[k]=await dbAll(KEY[k]);close();render();toast(label)});
async function demo(){const t=new Date(),days=n=>{const d=new Date(t);d.setDate(t.getDate()-n);return iso(d)},mo=new Date(t.getFullYear(),t.getMonth(),1),pm=new Date(t.getFullYear(),t.getMonth()-1,1);
 const L=[];const add=(type,amount,category,date,note,paymentMethod)=>L.push({id:uid(),type,amount,category,date,note,paymentMethod,account:'',createdAt:Date.now()+L.length,updatedAt:Date.now()});
 const mdate=(m,d)=>iso(new Date(m.getFullYear(),m.getMonth(),Math.min(d,28)));
 [pm,mo].forEach((m,i)=>{add('income',8500000,'Gaji',mdate(m,1),'Gaji bulanan','Bank');add('income',i?1200000:900000,'Bisnis',mdate(m,10),'Jualan online','E-wallet');add('expense',650000,'Listrik',mdate(m,5),'Token listrik','E-wallet');add('expense',385000,'Internet',mdate(m,6),'Internet rumah','Bank');add('expense',1200000,'Cicilan',mdate(m,8),'Cicilan motor','Bank');add('expense',900000+i*250000,'Makanan',mdate(m,12),'Belanja bulanan','Cash');add('expense',350000,'Transportasi',mdate(m,14),'Bensin','Cash');add('expense',200000,'Hiburan',mdate(m,16),'Nonton & jajan','E-wallet');add('expense',450000,'Pendidikan',mdate(m,18),'Iuran sekolah','Bank')});
 const rn=[['Makanan','Makan siang',[35000,48000,62000]],['Transportasi','Ojek online',[22000,31000]],['Belanja','Belanja harian',[85000,120000,150000]],['Kesehatan','Apotek',[75000]]];
 for(let i=0;i<24;i++){const r=rn[i%4];add('expense',r[2][i%r[2].length],r[0],days(i),r[1],PAY[i%3])}
 for(const x of L)await dbPut('tx',x);
 if(!S.bud.length)for(const [c,l] of [['Makanan',2000000],['Transportasi',1000000],['Hiburan',500000],['Belanja',1000000]])await dbPut('bud',{id:uid(),category:c,limit:l});
 if(!S.goals.length)await dbPut('goals',{id:uid(),name:'Liburan Keluarga',target:10000000,saved:4500000,deadline:iso(new Date(t.getFullYear(),11,31))});
 if(!S.rec.length)await dbPut('rec',{id:uid(),type:'expense',amount:650000,category:'Listrik',paymentMethod:'E-wallet',note:'Listrik PLN',day:5,last:''});
 for(const k in KEY)S[k]=await dbAll(KEY[k]);render();toast('Data contoh ditambahkan')}
const acts={
 close,yes:()=>cb&&cb(),addtx:()=>txForm(),demo,
 edittx:id=>txForm(find('tx',id)),deltx:id=>del('tx',id,'Transaksi dihapus','Hapus transaksi ini? Tindakan ini tidak dapat dibatalkan.'),
 settype:id=>{const f=$('form[data-f=tx]');f.type.value=id;f.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));$('#c').innerHTML=catOpts(id);const q=$('#qcs');if(q)q.innerHTML=qcHtml(id)||'<span class="mut">Muncul setelah ada transaksi.</span>'},
 qc:id=>{$('#c').value=id},qa:id=>{const i=$('#a');i.value=+id?amtFmt(String(num(i.value)+ +id)):''},mprev:()=>{S.moff-=S.period==='year'?12:1;render()},mnext:()=>{S.moff=Math.min(0,S.moff+(S.period==='year'?12:1));render()},askname:()=>askName(),
 ftype:id=>{F.type=id;render()},
 addbud:()=>budForm(),editbud:id=>budForm(find('bud',id)),delbud:id=>del('bud',id,'Budget dihapus','Hapus budget ini?'),
 addgoal:()=>goalForm(),editgoal:id=>goalForm(find('goals',id)),delgoal:id=>del('goals',id,'Target dihapus','Hapus target tabungan ini?'),
 fund:id=>simple('Tambah Dana',fAmt('a','Nominal (Rp)'),'fund',{id}),
 addrec:()=>recForm(),editrec:id=>recForm(find('rec',id)),delrec:id=>del('rec',id,'Template dihapus','Hapus template rutin ini?'),
 async useRec(id){const x=find('rec',id),n=Date.now();await dbPut('tx',{id:uid(),type:x.type,amount:x.amount,category:x.category,date:today(),note:x.note,paymentMethod:x.paymentMethod,account:'',by:USER.uid,byName:myName(),createdAt:n,updatedAt:n});x.last=today().slice(0,7);await dbPut('rec',x);S.tx=await dbAll('transactions');render();toast('Transaksi rutin dicatat')},
 delcat:id=>{event.preventDefault();del('cats',id,'Kategori dihapus','Hapus kategori ini? Transaksi lama tetap tersimpan.')},
 csv(){const r=range(),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=S.tx.filter(t=>inR(t,r)).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='income'?'Pemasukan':'Pengeluaran',t.category,t.paymentMethod,t.account,t.note,t.byName,t.amount].map(q).join(','));
  dl(`uangkita-${r[0]}_${r[1]}.csv`,'\ufeff'+['Tanggal,Jenis,Kategori,Metode,Akun,Catatan,Dicatat oleh,Nominal',...rows].join('\n'),'text/csv');toast('CSV diunduh')},
 async exportj(){const o={app:'UangKita',version:1,exportedAt:new Date().toISOString()};for(const k in KEY)o[KEY[k]]=await dbAll(KEY[k]);dl(`uangkita-backup-${today()}.json`,JSON.stringify(o,null,1),'application/json');toast('Backup diunduh')},
 reset:()=>confirmD('Semua transaksi, budget, target, dan template akan dihapus permanen. Lanjutkan?',()=>{wipe();seedCats();close();location.hash='#/home';render();toast('Semua data direset')},'Reset Semua')
};
const chs={
 per:e=>{S.period=e.value;S.moff=0;if(e.value==='custom'&&!S.cs){S.cs=range('month')[0];S.ce=today()}render()},cs:e=>{S.cs=e.value;render()},ce:e=>{S.ce=e.value;render()},
 rtype:e=>{$('#rcat').innerHTML=catOpts(e.value)},
 imp:async e=>{const f=e.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.transactions||!Array.isArray(o.transactions))throw 0;
  confirmD(`Pulihkan ${o.transactions.length} transaksi dari file ini? Data saat ini akan diganti.`,async()=>{wipe();for(const k in KEY)for(const it of o[KEY[k]]||[])dbPut(k,it);if(!(o.categories||[]).length)seedCats();close();render();toast('Data berhasil dipulihkan')},'Pulihkan')}catch{toast('File backup tidak valid')}e.value=''}
};
document.addEventListener('click',e=>{if(e.target.id==='ov')return close();const b=e.target.closest('[data-act]');if(b){if(b.tagName==='A')e.preventDefault();acts[b.dataset.act]?.(b.dataset.id)}});
document.addEventListener('submit',e=>{e.preventDefault();forms[e.target.dataset.f]?.(e.target)});
document.addEventListener('change',e=>{const k=e.target.dataset.ch;if(k)chs[k]?.(e.target);const fl=e.target.dataset.fl;if(fl){F[fl]=e.target.value;drawList()}});
document.addEventListener('input',e=>{if(e.target.dataset.amt!==undefined){e.target.value=amtFmt(e.target.value)}const fl=e.target.dataset.fl;if(fl==='q'){F.q=e.target.value;drawList()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

const AE={'auth/invalid-credential':'Email atau password salah.','auth/invalid-email':'Format email tidak valid.','auth/email-already-in-use':'Email sudah terdaftar. Silakan masuk.','auth/weak-password':'Password minimal 6 karakter.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','auth/network-request-failed':'Tidak ada koneksi internet.','auth/missing-password':'Isi password.'};
const aerr=e=>{const m=AE[e.code]||'Terjadi kesalahan. Coba lagi.';const x=$('#ae');x?x.textContent=m:toast(m)};
function authView(mode='login'){document.body.classList.add('noauth');$('#app').innerHTML=`<div class="card" style="margin-top:6vh;max-width:420px;margin-inline:auto"><div class="brand row" style="gap:10px"><img src="logo.png" alt="" width="44" height="44">UangKita</div><p class="mut" style="margin:6px 0 8px">Kelola Uang Keluarga, Lebih Tenang.</p><div class="seg"><button type="button" class="${mode==='login'?'on i':''}" data-act="authmode" data-id="login">Masuk</button><button type="button" class="${mode==='register'?'on i':''}" data-act="authmode" data-id="register">Daftar</button></div><form data-f="${mode}" novalidate><label for="em">Email</label><input id="em" name="email" type="email" autocomplete="email"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}"><div class="err" id="ae"></div><button class="btn" style="width:100%;margin-top:16px">${mode==='login'?'Masuk':'Daftar'}</button></form>${mode==='login'?'<p style="margin-top:12px;text-align:center"><a href="#" data-act="resetpw" style="color:var(--g)"><b>Lupa password?</b></a></p>':''}</div>`}
function famView(){document.body.classList.add('noauth');$('#app').innerHTML=`<div style="max-width:420px;margin:4vh auto 0"><div class="card"><h2>Buat keluarga baru</h2><p class="mut">Mulai dari awal, lalu undang anggota lain dengan kode keluarga.</p><form data-f="newfam"><label>Nama keluarga</label><input name="name" maxlength="40" placeholder="Keluarga Budi"><button class="btn" style="width:100%;margin-top:14px">Buat Keluarga</button></form></div><div class="card"><h2>Gabung dengan kode</h2><p class="mut">Minta kode keluarga dari Pengaturan di akun anggota yang sudah ada.</p><form data-f="joinfam"><label>Kode keluarga</label><input name="code" autocomplete="off" placeholder="Tempel kode di sini"><div class="err" id="ae"></div><button class="btn o" style="width:100%;margin-top:14px">Gabung</button></form></div><p style="text-align:center"><a href="#" data-act="logout" style="color:var(--mut)">Keluar (${esc(USER?.email)})</a></p></div>`}
Object.assign(forms,{
 async login(f){const d=new FormData(f);try{await signInWithEmailAndPassword(auth,d.get('email').trim(),d.get('password'))}catch(e){aerr(e)}},
 async register(f){const d=new FormData(f);try{await createUserWithEmailAndPassword(auth,d.get('email').trim(),d.get('password'))}catch(e){aerr(e)}},
 async newfam(f){const name=new FormData(f).get('name').trim()||'Keluarga Saya';try{const id=doc(collection(fdb,'families')).id;await setDoc(doc(fdb,'families',id),{name,members:[USER.uid],createdAt:Date.now()});await setDoc(doc(fdb,'users',USER.uid),{familyId:id},{merge:true});FID=id;await enter();toast('Keluarga dibuat')}catch(e){console.error(e);toast('Gagal membuat keluarga. Periksa koneksi dan rules.')}},
 async joinfam(f){const code=new FormData(f).get('code').trim();if(!code)return aerr({code:''});try{await updateDoc(doc(fdb,'families',code),{members:arrayUnion(USER.uid)});await setDoc(doc(fdb,'users',USER.uid),{familyId:code},{merge:true});FID=code;await enter();toast('Berhasil bergabung')}catch(e){console.error(e);$('#ae').textContent='Kode keluarga tidak ditemukan atau tidak valid.'}}
});
Object.assign(acts,{
 authmode:id=>authView(id),logout:()=>signOut(auth),
 async resetpw(){const em=$('#em').value.trim();if(!em)return aerr({code:'auth/invalid-email'});try{await sendPasswordResetEmail(auth,em);toast('Tautan reset password dikirim ke email')}catch(e){aerr(e)}},
 copyfam:async()=>{try{await navigator.clipboard.writeText(FID);toast('Kode keluarga disalin')}catch{toast('Salin manual dari kolom kode')}},
 async migrate(){try{const odb=await new Promise((res,rej)=>{const r=indexedDB.open('uangkita');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  if(!odb.objectStoreNames.contains('transactions')){odb.close();return toast('Tidak ada data lama di perangkat ini')}
  const get=st=>new Promise(res=>{const q=odb.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result)});
  const ops=[];let n=0;for(const k of ['tx','bud','goals','rec']){(await get(KEY[k])).forEach(x=>{ops.push(b=>b.set(ref(k,x.id),x));n++})}
  (await get('categories')).forEach(c=>{if(!S.cats.some(x=>x.name===c.name&&x.type===c.type))ops.push(b=>b.set(ref('cats',c.id),c))});
  odb.close();if(!n)return toast('Tidak ada data lama di perangkat ini');chunked(ops);toast(n+' data dipindahkan ke cloud')}catch(e){console.error(e);toast('Gagal memindahkan data lokal')}}
});
function askName(){sheet('Siapa nama Anda?',`<p class="mut" style="margin-top:8px">Nama ini tampil di transaksi yang Anda catat, supaya anggota keluarga tahu siapa pencatatnya.</p><form data-f="myname"><label for="mn">Nama panggilan</label><input id="mn" name="name" maxlength="20" placeholder="Contoh: Ibu, Ayah, Budi" value="${esc(NAME)}"><button class="btn" style="width:100%;margin-top:14px">Simpan</button></form>`);setTimeout(()=>$('#mn')?.focus(),50)}
forms.myname=f=>{const n=new FormData(f).get('name').trim().slice(0,20);if(!n)return toast('Isi nama dulu');NAME=n;setDoc(doc(fdb,'users',USER.uid),{name:n},{merge:true}).catch(fail);close();render(true);toast('Nama disimpan')};
chs.theme=e=>{try{localStorage.setItem('uk-theme',e.value)}catch{}applyTheme()};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
authView('login');
onAuthStateChanged(auth,async u=>{USER=u;ready=false;unsubs.forEach(x=>x());unsubs=[];
 if(!u){FID=null;for(const k in KEY)S[k]=[];return authView('login')}
 document.body.classList.add('noauth');$('#app').innerHTML='<p class="mut">Memuat data...</p>';
 try{const us=await getDoc(doc(fdb,'users',u.uid));FID=us.exists()?us.data().familyId||null:null;NAME=us.exists()?us.data().name||'':'';if(!FID)return famView();await enter()}
 catch(e){console.error(e);$('#app').innerHTML=empty('⚠️','Tidak bisa memuat data','Periksa koneksi internet dan rules Firestore, lalu muat ulang halaman.')}});
</script>
